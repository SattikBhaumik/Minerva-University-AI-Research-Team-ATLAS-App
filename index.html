<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ATLAS</title>
  <!-- PWA / iOS Safari standalone support.
       NO viewport-fit=cover — Safari auto-clips to safe area without it.
       NO position:fixed overlays — they break Safari's compositor at the
       Dynamic Island. See css/styles.css comment on body flex-column. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ATLAS">
  <!-- BEGIN design-tokens. Generated from design-tokens.json by tools/design_tokens.mjs. Do not edit by hand. -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)">
  <!-- END design-tokens -->

  <!-- Open Graph — read by Discord / iMessage / Slack / Bluesky / Mastodon
       / Threads (and every other major link-preview consumer). Mirror in
       per-view <title> updates from js/app.js. -->
  <meta property="og:title" content="ATLAS">
  <meta property="og:description" content="Your tagline here">
  <meta property="og:type" content="website">
  <!-- <meta property="og:image" content="https://example.com/og-image.png"> -->

  <!-- Smart App Banner — uncomment after App Store / Play Store ship.
       iOS uses meta tag; Android uses Digital Asset Links + Chrome
       install prompt (handled via /.well-known/assetlinks.json). -->
  <!-- <meta name="apple-itunes-app" content="app-id=YOUR_APP_ID"> -->

  <link rel="manifest" href="manifest.json">
  <!-- ?v= forces a fresh copy of every script and stylesheet: bump it
       whenever a file in css/, js/ or data/ changes (api.js passes it on to
       data/pathways.json), or browsers can pair a new
       index.html with an old app.js for up to 10 minutes. -->
  <link rel="stylesheet" href="css/styles.css?v=2026-11-22.6">
</head>
<body>

  <!-- Skip link for keyboard navigation (WCAG AA) -->
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- No sign-in: ATLAS never collects applicant data. -->
  <div id="app-screen" class="screen">

    <!-- SIDEBAR -->
    <aside id="channels-sidebar" class="channels-sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <h2 class="sidebar-title">ATLAS</h2>
      </div>
      <nav class="sidebar-nav" aria-label="Main navigation">
        <button class="sidebar-nav-item" data-role="applicant">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <span>Applicant</span>
        </button>
        <button class="sidebar-nav-item" data-role="minervan">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          <span>Minervan</span>
        </button>
      </nav>
    </aside>

    <!-- VIEWS — one section per view, toggled by showView() -->
    <main id="main-content">
      <section id="view-home" class="view" aria-label="Pathways">
        <div class="view-inner">
          <h1 class="view-heading">Explore a Minerva pathway</h1>
          <div id="pathways-root">
            <div class="spinner" role="status" aria-label="Loading"></div>
          </div>
        </div>
      </section>
    </main>

  </div>

  <script src="js/compat.js?v=2026-11-22.6"></script>
  <script src="js/api.js?v=2026-11-22.6"></script>
  <script src="js/pathways.js?v=2026-11-22.6"></script>
  <script src="js/app.js?v=2026-11-22.6"></script>
  <!-- Additive smart-TV layer + Cast sender: both self-disable off-TV
       (tv.js adds html.tv only on a TV runtime; cast-sender no-ops when the
       Cast framework never loads). See docs/TV-PLATFORMS.md. -->
  <link rel="stylesheet" href="tv.css?v=2026-11-22.6">
  <script src="tv.js?v=2026-11-22.6"></script>
  <script src="js/cast-sender.js?v=2026-11-22.6"></script>
</body>
</html>
